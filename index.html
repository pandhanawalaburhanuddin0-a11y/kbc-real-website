<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBC Game</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="login">
  <h1>💰 KAUN BANEGA CROREPATI 💰</h1>
  <input id="username" placeholder="Enter your name">
  <button onclick="startGame()">Start Game</button>
</div>

<div id="game">
  <div id="topbar">
    <div id="money">₹ 0</div>
    <div id="timer">⏳ 30</div>
  </div>

  <div id="questionBox">
    <p id="question"></p>
  </div>

  <div class="options">
    <button id="btn0" onclick="check(0)"></button>
    <button id="btn1" onclick="check(1)"></button>
    <button id="btn2" onclick="check(2)"></button>
    <button id="btn3" onclick="check(3)"></button>
  </div>

  <div class="controls">
    <button onclick="quitGame()">Quit</button>
  </div>

  <p id="result"></p>
  <button id="restartBtn" onclick="restartGame()">Restart</button>
</div>

<div id="winScreen">
  <h1>🏆 YOU WON 🏆</h1>
  <p id="finalMoney"></p>
  <button onclick="restartGame()">Play Again</button>
</div>

<div id="leaderboard">
  <h2>🏆 Leaderboard</h2>
  <ul id="scores"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
